---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Talos Setup
description: >-
  Install pinned Talos tooling, render and validate every node's machine
  config, and generate the talosconfig and kubeconfig that the upgrade jobs
  need. Tool versions come from .mise.toml so Renovate keeps them current in
  one place.

inputs:
  sops-age-key:
    description: age private key used to decrypt talsecret.sops.yaml
    required: true
  exclude-ip:
    description: >-
      Control plane IP to keep out of the talosctl endpoint list. Set this to
      the node a job is about to reboot so its API calls are not routed through
      the node that is going down.
    required: false
    default: ""
  cluster-access:
    description: >-
      Select a control plane endpoint and fetch a kubeconfig. Set to "false" to
      only render and validate, which needs no cluster at all.
    required: false
    default: "true"

outputs:
  endpoint:
    description: Control plane IP selected as the talosctl endpoint
    value: ${{ steps.endpoint.outputs.ip }}

runs:
  using: composite
  steps:
    - name: Install pinned tools
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac

        # Single source of truth for versions: the repo's .mise.toml
        pin() {
          local version
          version="$(sed -n "s|^\"aqua:$1\" = \"\(.*\)\"|\1|p" .mise.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::no pinned version for $1 in .mise.toml"
            exit 1
          fi
          echo "$version"
        }

        talos_version="$(pin siderolabs/talos)"
        topf_version="$(pin postfinance/topf)"
        sops_version="$(pin getsops/sops)"
        yq_version="$(pin mikefarah/yq)"
        kubectl_version="$(pin kubernetes/kubectl)"

        bin="${RUNNER_TEMP}/bin"
        mkdir -p "$bin"

        echo "talosctl v${talos_version}, topf v${topf_version}, sops v${sops_version}, yq v${yq_version}, kubectl v${kubectl_version} (${arch})"

        # These runners are pods in the cluster being upgraded, so cluster DNS
        # can blip underneath them while a node reboots. Retry rather than fail
        # a whole node's job on a transient resolver error.
        fetch() { curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$@"; }

        fetch -o "${bin}/talosctl" \
          "https://github.com/siderolabs/talos/releases/download/v${talos_version}/talosctl-linux-${arch}"
        fetch "https://github.com/postfinance/topf/releases/download/v${topf_version}/topf_linux_${arch}.tar.gz" \
          | tar -xz -C "$bin" topf
        # topf shells out to sops for every encrypted file it reads.
        fetch -o "${bin}/sops" \
          "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}"
        fetch -o "${bin}/yq" \
          "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}"
        fetch -o "${bin}/kubectl" \
          "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/${arch}/kubectl"

        chmod +x "${bin}"/*
        echo "$bin" >> "$GITHUB_PATH"

    - name: Render Talos configuration
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        set -euo pipefail

        # topf decrypts talsecret.sops.yaml and the encrypted patches through
        # sops, so the age key is the only secret needed. clusterconfig/ is
        # gitignored, which is why every job renders it afresh.
        cd talos
        rm -rf clusterconfig
        topf render -o clusterconfig
        topf talosconfig > clusterconfig/talosconfig

        # topf reports a node that fails to render and carries on with the rest,
        # so check every node topf.yaml declares actually got a file. topf also
        # does not validate what it renders -- a config Talos would reject has to
        # fail here, not halfway through a rollout.
        missing=0
        while read -r host; do
          file="clusterconfig/${host}.yaml"
          if [[ ! -f "$file" ]]; then
            echo "::error::topf did not render ${file}"
            missing=1
            continue
          fi
          talosctl validate --config "$file" --mode metal
        done < <(yq eval -r '.nodes[].host' topf.yaml)

        if (( missing != 0 )); then
          exit 1
        fi

        echo "TALOSCONFIG=${GITHUB_WORKSPACE}/talos/clusterconfig/talosconfig" >> "$GITHUB_ENV"

    - name: Select control plane endpoint
      id: endpoint
      if: inputs.cluster-access == 'true'
      shell: bash
      env:
        EXCLUDE_IP: ${{ inputs.exclude-ip }}
      run: |
        set -euo pipefail

        # Route API calls through a control plane node other than the one this
        # job is about to reboot.
        #
        # Selection happens inside yq rather than piping to `head -1`: head
        # closes the pipe after the first line, yq takes SIGPIPE, and pipefail
        # turns that into exit 141. It is a race -- yq usually finishes writing
        # three short lines first -- so it passed for several runs before
        # failing a dispatch outright.
        ip="$(yq eval -r \
          "[.nodes[] | select(.role == \"control-plane\") | select(.ip != \"${EXCLUDE_IP}\") | .ip] | .[0] // \"\"" \
          talos/topf.yaml)"

        if [[ -z "$ip" ]]; then
          echo "::error::no control plane node available as an endpoint (excluding ${EXCLUDE_IP})"
          exit 1
        fi

        echo "ip=${ip}" >> "$GITHUB_OUTPUT"
        echo "TALOS_ENDPOINT=${ip}" >> "$GITHUB_ENV"
        echo "Using control plane endpoint ${ip}"

    - name: Fetch kubeconfig
      if: inputs.cluster-access == 'true'
      shell: bash
      run: |
        set -euo pipefail

        talosctl kubeconfig "${RUNNER_TEMP}/kubeconfig" \
          --endpoints "${TALOS_ENDPOINT}" \
          --nodes "${TALOS_ENDPOINT}" \
          --force
        echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

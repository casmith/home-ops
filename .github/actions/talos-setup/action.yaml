---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Talos Setup
description: >-
  Install pinned Talos tooling and generate the talosconfig and kubeconfig that
  the upgrade jobs need. Tool versions come from .mise.toml so Renovate keeps
  them current in one place.

inputs:
  sops-age-key:
    description: age private key used to decrypt talsecret.sops.yaml
    required: true
  exclude-ip:
    description: >-
      Control plane IP to keep out of the talosctl endpoint list. Set this to
      the node a job is about to reboot so its API calls are not routed through
      the node that is going down.
    required: false
    default: ""

outputs:
  endpoint:
    description: Control plane IP selected as the talosctl endpoint
    value: ${{ steps.endpoint.outputs.ip }}

runs:
  using: composite
  steps:
    - name: Install pinned tools
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac

        # Single source of truth for versions: the repo's .mise.toml
        pin() {
          local version
          version="$(sed -n "s|^\"aqua:$1\" = \"\(.*\)\"|\1|p" .mise.toml)"
          if [[ -z "$version" ]]; then
            echo "::error::no pinned version for $1 in .mise.toml"
            exit 1
          fi
          echo "$version"
        }

        talos_version="$(pin siderolabs/talos)"
        yq_version="$(pin mikefarah/yq)"
        kubectl_version="$(pin kubernetes/kubectl)"
        sops_version="$(pin getsops/sops)"
        jq_version="$(pin jqlang/jq)"

        bin="${RUNNER_TEMP}/bin"
        mkdir -p "$bin"

        echo "talosctl v${talos_version}, yq v${yq_version}, kubectl v${kubectl_version}, sops v${sops_version}, jq v${jq_version} (${arch})"

        # These runners are pods in the cluster being upgraded, so cluster DNS
        # can blip underneath them while a node reboots. Retry rather than fail
        # a whole node's job on a transient resolver error.
        fetch() { curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors "$@"; }

        fetch -o "${bin}/talosctl" \
          "https://github.com/siderolabs/talos/releases/download/v${talos_version}/talosctl-linux-${arch}"
        fetch -o "${bin}/yq" \
          "https://github.com/mikefarah/yq/releases/download/v${yq_version}/yq_linux_${arch}"
        fetch -o "${bin}/kubectl" \
          "https://dl.k8s.io/release/v${kubectl_version}/bin/linux/${arch}/kubectl"
        # sops and jq replace what talhelper used to do implicitly: decrypt the
        # secrets bundle and the encrypted patches, and read the schematic ID
        # out of the Image Factory response.
        fetch -o "${bin}/sops" \
          "https://github.com/getsops/sops/releases/download/v${sops_version}/sops-v${sops_version}.linux.${arch}"
        fetch -o "${bin}/jq" \
          "https://github.com/jqlang/jq/releases/download/jq-${jq_version}/jq-linux-${arch}"

        chmod +x "${bin}"/*
        echo "$bin" >> "$GITHUB_PATH"

    - name: Generate Talos configuration
      shell: bash
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        set -euo pipefail

        # render.sh decrypts talsecret.sops.yaml and the encrypted patches
        # itself, so the age key is the only secret needed. clusterconfig/ is
        # gitignored, which is why every job regenerates it.
        #
        # Every node is rendered here, not just the one this job touches, so the
        # age key is needed in exactly one step -- the apply and upgrade actions
        # only ever read the files this step wrote.
        mkdir -p talos/clusterconfig
        bash talos/render.sh talosconfig > talos/clusterconfig/talosconfig

        while read -r hostname; do
          bash talos/render.sh config "$hostname" > "talos/clusterconfig/kubernetes-${hostname}.yaml"
          echo "rendered ${hostname}"
        done < <(bash talos/render.sh nodes)

        echo "TALOSCONFIG=${GITHUB_WORKSPACE}/talos/clusterconfig/talosconfig" >> "$GITHUB_ENV"

    - name: Select control plane endpoint
      id: endpoint
      shell: bash
      env:
        EXCLUDE_IP: ${{ inputs.exclude-ip }}
      run: |
        set -euo pipefail

        # Route API calls through a control plane node other than the one this
        # job is about to reboot.
        #
        # Collected into an array rather than piped to `head -1`: head closes
        # the pipe after the first line, the writer takes SIGPIPE, and pipefail
        # turns that into exit 141. It is a race -- the writer usually finishes
        # three short lines first -- so it passed for several runs before
        # failing a dispatch outright.
        candidates=()
        while read -r hostname; do
          candidate="$(bash talos/render.sh ip "$hostname")"
          # An `if` rather than `[[ ... ]] && candidates+=(...)`: the && form
          # leaves the loop with a non-zero status when the excluded node sorts
          # last, which under `set -e` is a failure looking for somewhere to
          # happen.
          if [[ "$candidate" != "$EXCLUDE_IP" ]]; then
            candidates+=("$candidate")
          fi
        done < <(bash talos/render.sh nodes controlplane)

        ip="${candidates[0]-}"

        if [[ -z "$ip" ]]; then
          echo "::error::no control plane node available as an endpoint (excluding ${EXCLUDE_IP})"
          exit 1
        fi

        echo "ip=${ip}" >> "$GITHUB_OUTPUT"
        echo "TALOS_ENDPOINT=${ip}" >> "$GITHUB_ENV"
        echo "Using control plane endpoint ${ip}"

    - name: Fetch kubeconfig
      shell: bash
      run: |
        set -euo pipefail

        talosctl kubeconfig "${RUNNER_TEMP}/kubeconfig" \
          --endpoints "${TALOS_ENDPOINT}" \
          --nodes "${TALOS_ENDPOINT}" \
          --force
        echo "KUBECONFIG=${RUNNER_TEMP}/kubeconfig" >> "$GITHUB_ENV"

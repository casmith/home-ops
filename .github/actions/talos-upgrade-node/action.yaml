---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Talos Upgrade Node
description: >-
  Upgrade a single Talos node and hold until it is healthy again. Skips nodes
  already running the target version so a rerun after a partial failure resumes
  instead of rebooting healthy nodes.

inputs:
  hostname:
    description: Talos hostname, as it appears in talconfig.yaml and Kubernetes
    required: true
  ip:
    description: Node IP address
    required: true
  target-version:
    description: Talos version this node should end up on
    required: true
  control-plane:
    description: Whether this node is a control plane member
    required: false
    default: "false"
  dry-run:
    description: Print the upgrade command instead of running it
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check current version
      id: current
      shell: bash
      env:
        IP: ${{ inputs.ip }}
        TARGET: ${{ inputs.target-version }}
      run: |
        set -euo pipefail

        # The first "Tag:" belongs to the client, so only read the one that
        # follows the Server: header.
        current="$(talosctl --nodes "$IP" --endpoints "$TALOS_ENDPOINT" version --short \
          | awk '/^Server:/ { server = 1 } server && $1 == "Tag:" { print $2 }')" || true

        if [[ -z "$current" ]]; then
          echo "::error::could not determine the Talos version running on $IP"
          exit 1
        fi

        echo "current=${current}" >> "$GITHUB_OUTPUT"

        if [[ "$current" == "$TARGET" ]]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Already running ${TARGET}"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Running ${current}, upgrading to ${TARGET}"
        fi

    - name: Record cordon state
      id: cordon
      if: steps.current.outputs.skip == 'false'
      shell: bash
      env:
        HOSTNAME_: ${{ inputs.hostname }}
      run: |
        set -euo pipefail

        # Remember whether the node was already cordoned so an operator's
        # deliberate cordon survives this run.
        was_cordoned="$(kubectl get node "$HOSTNAME_" -o jsonpath='{.spec.unschedulable}')"
        echo "was-cordoned=${was_cordoned:-false}" >> "$GITHUB_OUTPUT"

    - name: Drain workloads
      if: steps.current.outputs.skip == 'false' && inputs.dry-run != 'true'
      shell: bash
      env:
        HOSTNAME_: ${{ inputs.hostname }}
      run: |
        set -euo pipefail

        # Longhorn guards each instance-manager pod with a PodDisruptionBudget
        # for as long as that manager runs engines for attached volumes, and it
        # is the workload pods on this node that keep those engines alive.
        # talosctl's own drain evicts workloads and the instance manager in a
        # single pass, so the manager's eviction is refused while its engines
        # are still up and the drain fails outright -- see talos/UPGRADE.md.
        #
        # Draining the workloads first breaks that circle. The `!=` selector
        # spares the instance manager: label selectors also match objects that
        # lack the key entirely, so ordinary workload pods are still evicted.
        kubectl drain "$HOSTNAME_" \
          --ignore-daemonsets \
          --delete-emptydir-data \
          --pod-selector='longhorn.io/component!=instance-manager' \
          --timeout=10m

        # With the workloads gone the volumes detach, the engine count falls to
        # zero, and Longhorn removes the PDB by itself -- no drain-policy
        # override required. Measured at roughly two seconds on k8s-pi-8.
        count_engines() {
          kubectl -n longhorn-system get engines.longhorn.io \
            -o jsonpath="{range .items[?(@.spec.nodeID==\"${HOSTNAME_}\")]}{.metadata.name}{\"\n\"}{end}" \
            2>/dev/null | grep -c . || true
        }

        deadline=$(( SECONDS + 300 ))
        while [[ "$(count_engines)" != "0" ]]; do
          if (( SECONDS > deadline )); then
            echo "::error::Longhorn engines are still running on ${HOSTNAME_}; the instance-manager PDB will block the upgrade"
            kubectl -n longhorn-system get pdb 2>&1 | grep instance-manager || true
            exit 1
          fi
          echo "  waiting for Longhorn engines to leave ${HOSTNAME_} ($(count_engines) remaining)"
          sleep 10
        done

        echo "No Longhorn engines remain on ${HOSTNAME_}"

    - name: Upgrade
      if: steps.current.outputs.skip == 'false' && inputs.dry-run != 'true'
      shell: bash
      env:
        IP: ${{ inputs.ip }}
      run: |
        set -euo pipefail

        # talhelper resolves the correct factory schematic for this node and the
        # version from talenv.yaml.
        #
        # --drain=false because the node was drained in the previous step.
        # Leaving talosctl to drain would reintroduce the single-pass eviction
        # this action exists to avoid. It also means talosctl no longer
        # uncordons on success, so the health gate below does it instead.
        #
        # The timeout is deliberately short. The failures seen in practice --
        # a drain blocked by a Longhorn instance-manager PDB, and an unmount
        # wedged on an unreachable Longhorn NFS share -- never recover on their
        # own, so a long timeout only delays a failure that is already certain.
        cd talos
        talhelper gencommand upgrade \
          --node "$IP" \
          --extra-flags "--endpoints=${TALOS_ENDPOINT} --timeout=12m --drain=false" \
          | tee /dev/stderr \
          | bash

    - name: Show upgrade command (dry run)
      if: steps.current.outputs.skip == 'false' && inputs.dry-run == 'true'
      shell: bash
      env:
        IP: ${{ inputs.ip }}
      run: |
        set -euo pipefail
        cd talos
        echo "Would drain workloads off ${{ inputs.hostname }}, wait for Longhorn"
        echo "engines to leave it, then run:"
        talhelper gencommand upgrade \
          --node "$IP" \
          --extra-flags "--endpoints=${TALOS_ENDPOINT} --timeout=12m --drain=false"

    - name: Wait for healthy
      if: steps.current.outputs.skip == 'false' && inputs.dry-run != 'true'
      shell: bash
      env:
        IP: ${{ inputs.ip }}
        HOSTNAME_: ${{ inputs.hostname }}
        TARGET: ${{ inputs.target-version }}
        IS_CONTROL_PLANE: ${{ inputs.control-plane }}
        WAS_CORDONED: ${{ steps.cordon.outputs.was-cordoned }}
      run: |
        set -euo pipefail

        deadline=$(( SECONDS + 900 ))

        wait_for() {
          local description="$1"; shift
          echo "Waiting for ${description}..."
          until "$@"; do
            if (( SECONDS > deadline )); then
              echo "::error::timed out waiting for ${description} on ${HOSTNAME_}"
              exit 1
            fi
            sleep 15
          done
          echo "  ${description}: ok"
        }

        at_target_version() {
          local current
          current="$(talosctl --nodes "$IP" --endpoints "$TALOS_ENDPOINT" version --short 2>/dev/null \
            | awk '/^Server:/ { server = 1 } server && $1 == "Tag:" { print $2 }')" || return 1
          [[ "$current" == "$TARGET" ]]
        }

        node_ready() {
          local status
          status="$(kubectl get node "$HOSTNAME_" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" || return 1
          [[ "$status" == "True" ]]
        }

        etcd_healthy() {
          local health
          health="$(talosctl --nodes "$IP" --endpoints "$TALOS_ENDPOINT" service etcd 2>/dev/null \
            | awk '$1 == "HEALTH" { print $2 }')" || return 1
          [[ "$health" == "OK" ]]
        }

        wait_for "${HOSTNAME_} to report ${TARGET}" at_target_version
        wait_for "${HOSTNAME_} to be Ready" node_ready

        if [[ "$IS_CONTROL_PLANE" == "true" ]]; then
          wait_for "etcd on ${HOSTNAME_} to be healthy" etcd_healthy
        fi

        # The drain step cordoned the node. Undo that unless it was already
        # cordoned before this job started, so a deliberate operator cordon is
        # preserved. This is load-bearing now that the upgrade runs with
        # --drain=false: talosctl only uncordons nodes it cordoned itself.
        if [[ "$WAS_CORDONED" != "true" ]]; then
          kubectl uncordon "$HOSTNAME_"
        else
          echo "${HOSTNAME_} was cordoned before this run; leaving it cordoned"
        fi

    - name: Diagnose failure
      if: failure()
      shell: bash
      env:
        IP: ${{ inputs.ip }}
        HOSTNAME_: ${{ inputs.hostname }}
      run: |
        # Never mask the real failure: this step is diagnostics only.
        set +e

        echo "::group::Talos service states on ${HOSTNAME_}"
        talosctl --nodes "$IP" --endpoints "$TALOS_ENDPOINT" services 2>&1 | head -20
        echo "::endgroup::"

        # The tail of the machine log is what distinguishes the known failure
        # modes: a blocked drain never reaches stopServices, while a wedged
        # unmount sits in the umount phase logging NFS timeouts.
        echo "::group::Last machine log lines on ${HOSTNAME_}"
        talosctl --nodes "$IP" --endpoints "$TALOS_ENDPOINT" dmesg 2>&1 | tail -20
        echo "::endgroup::"

        echo "::group::Node status"
        kubectl get node "$HOSTNAME_" -o wide 2>&1
        echo "::endgroup::"

    - name: Restore cordon state
      if: failure()
      shell: bash
      env:
        HOSTNAME_: ${{ inputs.hostname }}
        WAS_CORDONED: ${{ steps.cordon.outputs.was-cordoned }}
      run: |
        set +e

        # A failed upgrade leaves the node cordoned by talosctl's drain. Undo
        # that, or the node sits unschedulable until someone notices -- and a
        # rerun will not fix it, because a node already on the target version is
        # skipped before it reaches the uncordon in the health gate.
        if [[ "$WAS_CORDONED" == "true" ]]; then
          echo "${HOSTNAME_} was cordoned before this run; leaving it cordoned"
          exit 0
        fi

        cordoned="$(kubectl get node "$HOSTNAME_" -o jsonpath='{.spec.unschedulable}' 2>/dev/null)"
        if [[ "$cordoned" == "true" ]]; then
          echo "::warning::${HOSTNAME_} was left cordoned by the failed upgrade; uncordoning"
          kubectl uncordon "$HOSTNAME_"
        fi

    - name: Summary
      if: always()
      shell: bash
      env:
        HOSTNAME_: ${{ inputs.hostname }}
        IP: ${{ inputs.ip }}
        TARGET: ${{ inputs.target-version }}
        PREVIOUS: ${{ steps.current.outputs.current }}
        SKIPPED: ${{ steps.current.outputs.skip }}
        DRY_RUN: ${{ inputs.dry-run }}
        JOB_STATUS: ${{ job.status }}
      run: |
        set -euo pipefail

        if [[ "$JOB_STATUS" == "failure" ]]; then
          result="**failed** while on ${PREVIOUS:-an unknown version}"
        elif [[ "$SKIPPED" == "true" ]]; then
          result="already on ${TARGET}, skipped"
        elif [[ "$DRY_RUN" == "true" ]]; then
          result="dry run, would upgrade ${PREVIOUS:-unknown} to ${TARGET}"
        else
          result="upgraded ${PREVIOUS:-unknown} to ${TARGET}"
        fi

        echo "### ${HOSTNAME_} (${IP})" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "${result}" >> "$GITHUB_STEP_SUMMARY"

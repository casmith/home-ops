---
# 8GB Pi: carries Longhorn replicas, so render.sh adds
# patches/storage/machine-longhorn-mounts.yaml.
machine:
  install:
    disk: /dev/sda
  network:
    hostname: k8s-pi-7
    interfaces:
      - deviceSelector:
          hardwareAddr: "d8:3a:dd:17:f9:15"
        dhcp: false
        addresses:
          - "192.168.10.77/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "192.168.10.1"
        mtu: 1500

---
# 4GB Pi: no Longhorn bind mounts. Longhorn still runs here -- replicas are
# kept off via allowScheduling on the nodes.longhorn.io object, not a taint.
machine:
  install:
    disk: /dev/sda
  network:
    hostname: k8s-pi-3
    interfaces:
      - deviceSelector:
          hardwareAddr: "dc:a6:32:7c:9c:8a"
        dhcp: false
        addresses:
          - "192.168.10.73/24"
        routes:
          - network: "0.0.0.0/0"
            gateway: "192.168.10.1"
        mtu: 1500

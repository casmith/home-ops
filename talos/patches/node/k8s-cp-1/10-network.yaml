# Static addressing for k8s-cp-1. The alias pins the NIC by MAC, so the
# config survives interface renames across kernels.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("52:54:00:c4:9c:d7", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.10.33/24
routes:
  - gateway: 192.168.10.1
---
# Control plane VIP, also the Kubernetes API endpoint in topf.yaml.
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.10.254
link: ethSel0

# TEMPORARY -- diagnostic for the unreclaimable slab leak. Revert once traced.
#
# Every node in the cluster leaks unreclaimable slab, but k8s-cp-1 and
# k8s-cp-2 do it 10-20x faster than anything else, which is why they are the
# ones that have to be rebooted every ~9 days before the Talos OOM controller
# starts sweeping BestEffort cgroups and takes Longhorn's CSI plugin with it.
# Measured 2026-09-18:
#
#   k8s-cp-1   9.6d   7168 MiB   747 MiB/day   (QEMU/KVM guest)
#   k8s-cp-2   7.6d   7301 MiB   961 MiB/day   (QEMU/KVM guest)
#   k8s-cp-3   9.6d    421 MiB    44 MiB/day   (bare metal, same uptime)
#   k8s-pi-7   4.1d    271 MiB    66 MiB/day
#   k8s-pi-2  21.4d    138 MiB     6 MiB/day
#
# The two fast nodes are the cluster's only QEMU/KVM guests, so this may be
# the same leak amplified by a virtio path, or a second guest-specific one on
# top. The trace is what tells them apart. All of the leaked objects land in a
# single randomized kmalloc 4k bucket, and buckets are chosen by hashing the
# caller, so one allocation site dominates.
#
# CONFIG_SLUB_DEBUG is built in but allocation tracking is off. slub_debug=U
# enables store_user on the matching caches, recording the allocating stack for
# every live object. Read it back after 3-4 days -- before the node approaches
# the wall, since the tracking metadata itself costs memory:
#
#   talosctl -n 192.168.10.33 read /proc/slabinfo | grep kmalloc-rnd
#   talosctl -n 192.168.10.33 read \
#     /sys/kernel/debug/slab/kmalloc-rnd-<NN>-4k/alloc_traces
#
# Grep the bucket that has grown: the randomization seed is reseeded on every
# boot, so the number moves. kmalloc-4k is listed alongside the glob because a
# callsite hashing to bucket 0 lands there instead.
#
# extraKernelArgs and grubUseUKICmdline are mutually exclusive -- Talos rejects
# a config setting both, and topf renders grubUseUKICmdline true by default, so
# it has to be turned off here. That is safe on this node specifically: the VMs
# boot legacy BIOS through GRUB rather than systemd-boot, so GRUB builds the
# cmdline from config instead of taking it from the signed UKI.
#
# k8s-cp-1 only: it is the fastest leaker with the most headroom, so it yields
# a conclusive trace soonest, and store_user disables some SLUB fast paths.
machine:
  install:
    grubUseUKICmdline: false
    extraKernelArgs:
      - slub_debug=U,kmalloc-rnd-*-4k,kmalloc-4k

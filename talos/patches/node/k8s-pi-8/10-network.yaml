# Static addressing for k8s-pi-8. The alias pins the NIC by MAC, so the
# config survives interface renames across kernels.
apiVersion: v1alpha1
kind: LinkAliasConfig
name: ethSel0
selector:
  match: glob("d8:3a:dd:44:0e:38", mac(link.hardware_addr))
---
apiVersion: v1alpha1
kind: LinkConfig
name: ethSel0
mtu: 1500
addresses:
  - address: 192.168.10.78/24
routes:
  - gateway: 192.168.10.1

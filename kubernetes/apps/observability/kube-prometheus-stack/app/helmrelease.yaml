---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    cleanPrometheusOperatorObjectNames: true
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.kalde.in
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.kalde.in
        version: v2.55.1 # override 'unsupported Prometheus version' error
        image:
          registry: docker.io
          repository: prompp/prompp
          tag: 0.8.10
        securityContext:
          runAsNonRoot: true
          runAsUser: 1024
          runAsGroup: 100
          fsGroup: 100
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 3d
        retentionSize: 10GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ""
              resources:
                requests:
                  storage: 10Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # node-exporter shipped with no requests, which left it BestEffort. Talos
      # runs a userspace PSI-driven OOM controller that SIGKILLs whole cgroups
      # under /sys/fs/cgroup/kubepods/besteffort, so node-exporter was among the
      # first things killed on a struggling node -- 26 restarts on k8s-pi-4 on
      # 2026-08-18, ending in CrashLoopBackOff.
      #
      # That is the worst possible pod to lose: the node stops reporting exactly
      # when it is in trouble, `kubectl top node` returns <unknown>, and the
      # Grafana dashboards render the resulting gap as a healthy node. The node
      # was pinned at 74% iowait and flapping NodeNotReady while the dashboard
      # looked clean.
      #
      # Requests move it to Burstable so it survives to report the incident.
      # Sized from steady state across the 11 nodes; the limit is generous
      # because being OOMKilled by the kernel is no better than by Talos.
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          memory: 128Mi
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
    grafana:
      enabled: false

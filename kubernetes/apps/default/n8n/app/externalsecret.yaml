---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: n8n-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        N8N_BASIC_AUTH_USER: "{{ .N8N_BASIC_AUTH_USER }}"
        N8N_BASIC_AUTH_PASSWORD: "{{ .N8N_BASIC_AUTH_PASSWORD }}"
        N8N_RUNNERS_ENABLED: "true"
        N8N_ENCRYPTION_KEY: "{{ .N8N_ENCRYPTION_KEY }}"

        # Source of truth for the Invoice Ninja token used by the
        # "Add expense from email" workflow. Nothing reads this from the
        # environment -- expressions can't, since N8N_BLOCK_ENV_ACCESS_IN_NODE
        # is left at its blocking default. It lives here so the value is
        # 1Password-managed and available to re-create the n8n credential.
        INVOICENINJA_API_TOKEN: "{{ .invoiceninja_api_token }}"

        # Same arrangement for the SSH key the "Minecraft world reset" workflow
        # uses to reach pve5-ubuntu-highmem-1. Nothing reads this from the
        # environment either -- the SSH node reads an n8n credential, which lives
        # encrypted in n8n's Postgres under N8N_ENCRYPTION_KEY and is not
        # recoverable from anywhere else. This makes 1Password the durable copy so
        # the credential can be re-created after a database loss.
        #
        # Safe to carry as an env var for the same reason as the token above:
        # N8N_BLOCK_ENV_ACCESS_IN_NODE is left at its blocking default, so a Code
        # node cannot read it. It also grants very little on its own -- the
        # matching entry in pve5's authorized_keys pins it to a forced
        # `command="...minecraft-reset-worlds.sh --dry-run"`, so the key cannot
        # run anything else on that host.
        MINECRAFT_SSH_KEY: "{{ .minecraft_ssh_key }}"

        DB_POSTGRESDB_DATABASE: n8n
        DB_POSTGRESDB_HOST: postgres17-rw.database.svc.cluster.local
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_SCHEMA: public
        DB_POSTGRESDB_USER: "{{ .POSTGRES_USER }}"
        DB_POSTGRESDB_PASSWORD: "{{ .POSTGRES_PASS }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: n8n
        INIT_POSTGRES_HOST: postgres17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
  dataFrom:
    - extract:
        key: n8n
    - extract:
        key: cloudnative-pg
  refreshInterval: 5m

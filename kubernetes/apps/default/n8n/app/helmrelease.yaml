---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: n8n
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: RollingUpdate
        initContainers:
          init-db:
            image:
              repository: ghcr.io/onedr0p/postgres-init
              tag: 17.4
            envFrom: &envFrom
              - secretRef:
                  name: n8n-secret
          # Reconciles the workflows in ./workflows/ into n8n's database, making
          # git the source of truth for them. `import:workflow` upserts on the
          # workflow's `id` field, so a re-run updates in place -- but a JSON
          # file with no `id` gets a fresh nanoid assigned and lands as a NEW
          # workflow every single deploy. Every file in ./workflows/ must carry
          # a stable id.
          #
          # DB_TYPE is repeated here on purpose. It is set on the app container
          # below, not in n8n-secret, and without it the CLI falls back to its
          # sqlite default -- importing into a throwaway file inside this init
          # container and reporting success while the real database is never
          # touched.
          #
          # Runs as an initContainer rather than a Job so it is ordered before
          # n8n starts and re-runs on every rollout. A malformed workflow fails
          # this container, so the new pod never goes Ready -- with replicas: 1
          # and RollingUpdate (maxUnavailable resolves to 0) the previous pod
          # keeps serving, so a bad commit blocks the deploy instead of taking
          # n8n down.
          init-workflows:
            # Explicit, because container order here is a topological sort of
            # `dependsOn` (the chart runs Kahn's algorithm over it), not the
            # order they appear in this file. The database has to exist first.
            dependsOn: init-db
            image:
              repository: n8nio/n8n
              tag: 2.34.4
            # The image entrypoint is `exec n8n "$@"`, so args alone are enough.
            args:
              - import:workflow
              - --separate
              - --input=/workflows
            envFrom: *envFrom
            env:
              DB_TYPE: postgresdb
        containers:
          app:
            image:
              repository: n8nio/n8n
              tag: 2.36.0
            envFrom: *envFrom
            env:
              N8N_HOST: n8n.kalde.in
              N8N_PORT: &port 5678
              N8N_PROTOCOL: https
              WEBHOOK_URL: "https://n8n.kalde.in/"
              DB_TYPE: postgresdb
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 2
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi

    persistence:
      # advancedMounts rather than globalMounts: only the importer needs these
      # files. Mounting them into the app container too would put a directory of
      # workflow JSON inside a long-running pod for no reason.
      workflows:
        type: configMap
        name: n8n-workflows
        advancedMounts:
          n8n:
            init-workflows:
              - path: /workflows

    service:
      app:
        ports:
          http:
            port: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.kalde.in"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

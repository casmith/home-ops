---
# 1Password item `khaos-news` (vault home-ops) needs:
#   POSTGRES_PASS       password for the khaos_news DB owner (alphanumeric: it is
#                       embedded in a connection URL)
#   MINIFLUX_API_TOKEN  Miniflux → Settings → API Keys
#   NTFY_USER           ntfy-obs publisher for khaos-* topics (same as NTFY_KHAOS_USER
#   NTFY_PASSWORD       / NTFY_KHAOS_PASSWORD in home-ops-observability's ntfy-secret)
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: khaos-news
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: khaos-news-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KHAOS_DATABASE_URL: "postgresql+psycopg://khaos_news:{{ .POSTGRES_PASS }}@khaos-news-rw.database.svc.cluster.local:5432/khaos_news"
        KHAOS_MINIFLUX_API_TOKEN: "{{ .MINIFLUX_API_TOKEN }}"
        KHAOS_NTFY_USER: "{{ .NTFY_USER }}"
        KHAOS_NTFY_PASSWORD: "{{ .NTFY_PASSWORD }}"
        # pgsqldump backup job
        DB_HOST: khaos-news-rw.database.svc.cluster.local
        DB_USER: khaos_news
        DB_PASS: "{{ .POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: khaos-news
  refreshInterval: 5m

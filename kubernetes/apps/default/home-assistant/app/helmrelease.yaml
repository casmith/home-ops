---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 30m
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Pin to the amd64 control-plane nodes (k8s-cp-*). The arm64 Raspberry Pi
    # workers boot HA slowly enough that the aiodns import races and aiohttp
    # caches a broken DNS resolver for the whole process, breaking every
    # network integration. The faster x86 nodes boot cleanly.
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
    controllers:
      home-assistant:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.1@sha256:e1f54eb0306d7ded8b3cdee70c21178413cd175aa3e526452af0e086a39ecc51
            env:
              TZ: America/Chicago
              HASS_HTTP_TRUSTED_PROXY_1: 10.42.0.0/16
            resources:
              requests:
                cpu: 1
                memory: 1Gi
              limits:
                memory: 1.5Gi

    service:
      app:
        # Shares the internal gateway's IP via Cilium LB-IPAM so HA also answers
        # on 192.168.10.252:8123 directly, bypassing the gateway (and its TLS /
        # HTTPRoute path) for LAN clients and integrations that need raw HTTP.
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: "192.168.10.252"
          lbipam.cilium.io/sharing-key: "internal-gateway"
          lbipam.cilium.io/sharing-cross-namespace: "*"
        ports:
          http:
            port: &port 8123

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Home Assistant
          gethomepage.dev/description: Home automation
          gethomepage.dev/group: Home
          gethomepage.dev/icon: home-assistant.png
          gethomepage.dev/href: https://home-assistant.kalde.in
        hostnames: ["home-assistant.kalde.in"]
        parentRefs:
          - name: external
            namespace: kube-system
            sectionName: https
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume1/cluster/home-assistant/config
        globalMounts:
          - path: /config
      # GitOps-managed Lovelace dashboards (the "Elmdon" YAML dashboard).
      # Directory mount (not subPath) so kubelet syncs edits into the pod live.
      dashboards:
        type: configMap
        name: home-assistant-dashboards
        globalMounts:
          - path: /config/dashboards
            readOnly: true
      # Hermes Agent conversation integration — makes "Jarvis" selectable as the
      # Conversation agent for the Voice PE assistant, so Hermes (on
      # 192.168.10.56) becomes the brain instead of HA Assist. HA keeps the
      # hardware, wake word, Whisper and Piper. See calypso-deploy hermes/README.md.
      #
      # Vendored rather than installed through HACS so it is GitOps-managed and
      # reviewable. It declares "requirements": [] — no external Python deps —
      # which is what makes a read-only mount viable: HA could not pip-install
      # into a ConfigMap.
      #
      # `items` remaps the flat ConfigMap keys onto the nested layout HA's
      # integration loader expects; ConfigMap keys cannot contain "/", but an
      # item's `path` can.
      hermes-conversation:
        type: configMap
        name: home-assistant-hermes-conversation
        globalMounts:
          - path: /config/custom_components/hermes_conversation
            readOnly: true
        items:
          - key: __init__.py
            path: __init__.py
          - key: api.py
            path: api.py
          - key: compat.py
            path: compat.py
          - key: config_flow.py
            path: config_flow.py
          - key: const.py
            path: const.py
          - key: conversation.py
            path: conversation.py
          - key: manifest.json
            path: manifest.json
          - key: strings.json
            path: strings.json
          - key: translations-en.json
            path: translations/en.json

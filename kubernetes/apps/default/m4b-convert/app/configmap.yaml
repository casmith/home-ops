---
apiVersion: v1
kind: ConfigMap
metadata:
  name: m4b-convert-script
  namespace: default
data:
  convert.sh: |
    #!/bin/sh
    # Multi-file MP3 audiobooks -> single chapterized M4B.
    #
    # All three dirs are subdirs of ONE NFS mount (/ingest), so every move
    # between them is a true rename within a single filesystem: atomic, no
    # copy, and it preserves the hardlink back to the seeding torrent.
    # Mounting them as separate NFS shares would make each move a
    # cross-device copy+chown, which fails as non-root on a squashed export.
    #
    # $IN entries are hardlinks to data transmission is still seeding, so this
    # NEVER writes into them; it only reads and, on success, renames the
    # ingest name away. The seeded inode survives.
    # $OUT is staged as .<name>.part and renamed into place, so the beets
    # cronjob never sees a partially-written book.
    set -eu

    IN=/ingest/audiobooks
    OUT=/ingest/converted
    FAILED=/ingest/failed
    # Nested/ambiguous folder structures land here for a manual fix (rename the
    # subfolders / move audio up) then a re-drop into audiobooks/. Not read by
    # any downstream stage.
    REVIEW=/ingest/review

    BITRATE=${BITRATE:-96k}
    SAMPLERATE=${SAMPLERATE:-22050}
    CHANNELS=${CHANNELS:-1}
    JOBS=${JOBS:-4}

    # m4b-tool builds output here (local emptyDir); the finished book is then
    # relocated to NFS. Both must share one filesystem with M4BTOOL_TMP_DIR so
    # m4b-tool's internal tmp->output rename() stays intra-device.
    STAGE=/tmp/staging

    log() { echo "[$(date -Is)] $*"; }

    mkdir -p "$IN" "$OUT" "$FAILED" "$REVIEW" "$STAGE"

    # concurrencyPolicy:Forbid only serializes *scheduled* runs; a manually
    # created Job (e.g. a smoke test) can still overlap a scheduled tick, and
    # two pods sharing these NFS dirs rm -rf each other's work. Take a shared
    # lock (mkdir is atomic on NFS) so any second run bails cleanly. Reclaim a
    # lock older than 180m in case a holder died without releasing it.
    LOCK=/ingest/.m4b-convert.lock
    if [ -d "$LOCK" ] && [ -z "$(find "$LOCK" -maxdepth 0 -mmin -180 2>/dev/null)" ]; then
      log "clearing stale lock"
      rmdir "$LOCK" 2>/dev/null || true
    fi
    if ! mkdir "$LOCK" 2>/dev/null; then
      log "another m4b-convert run is active; exiting"
      exit 0
    fi
    trap 'rmdir "$LOCK" 2>/dev/null || true' EXIT INT TERM

    # Audio directly inside a dir (depth 1). Nested audio is handled separately,
    # so the flat classifiers below only look at the dir's own files.
    has_ext() {
      find "$1" -maxdepth 1 -type f -iname "*.$2" -print 2>/dev/null | head -n1 | grep -q .
    }

    count_m4b() {
      find "$1" -maxdepth 1 -type f \( -iname '*.m4b' -o -iname '*.m4a' \) 2>/dev/null | wc -l | tr -d ' '
    }

    has_audio_flat() {
      has_ext "$1" mp3 || has_ext "$1" m4b || has_ext "$1" m4a
    }

    has_audio_anywhere() {
      find "$1" -type f \( -iname '*.mp3' -o -iname '*.m4b' -o -iname '*.m4a' \) 2>/dev/null | head -n1 | grep -q .
    }

    # album_of <audio-file> — always prints exactly one line (empty if there's
    # no file or no album tag) so callers can count lines reliably. ffprobe
    # isn't in the image, but ffmpeg is, and it dumps tags as key=value.
    album_of() {
      a=""
      [ -n "$1" ] && a=$(ffmpeg -i "$1" -f ffmetadata - 2>/dev/null | sed -n 's/^album=//p' | head -n1)
      printf '%s\n' "$a"
    }

    review() {
      # quarantine <src> <name> for a manual fix
      log "REVIEW (ambiguous nesting): $2"
      rm -rf "${REVIEW:?}/$2"
      mv "$1" "$REVIEW/$2"
    }

    publish() {
      # publish <work-dir> <name> — atomic rename into $OUT
      rm -rf "${OUT:?}/$2"
      mv "$1" "$OUT/$2"
    }

    fail() {
      # fail <src> <name>
      log "FAILED: $2"
      rm -rf "${FAILED:?}/$2"
      mv "$1" "$FAILED/$2"
    }

    # do_merge <src> <name> <mode>
    #   mode=transcode  MP3 (and friends) -> re-encoded AAC with the spoken-word
    #                   settings; filenames become chapter titles.
    #   mode=copy       multiple existing m4b/m4a parts -> single m4b via a
    #                   lossless stream copy (--no-conversion). No chapter
    #                   override, so embedded chapter marks are preserved;
    #                   m4b-tool falls back to per-file chapters when there
    #                   are none.
    do_merge() {
      src=$1
      name=$2
      mode=$3
      work="$OUT/.$name.part"        # NFS, hidden so beets ignores it
      stage="$STAGE/$name"           # local scratch, same FS as m4b-tool tmp
      rm -rf "$work" "$stage"
      mkdir -p "$stage"
      case "$mode" in
        transcode)
          log "converting (transcode): $name (bitrate=$BITRATE rate=$SAMPLERATE ch=$CHANNELS)"
          set -- --audio-bitrate "$BITRATE" --audio-samplerate "$SAMPLERATE" \
                 --audio-channels "$CHANNELS" --use-filenames-as-chapters
          ;;
        copy)
          log "merging (lossless): $name"
          set -- --no-conversion
          ;;
      esac
      # Build entirely on local scratch: m4b-tool's tmp->output rename() cannot
      # cross from the emptyDir onto NFS, so the output must land locally too.
      if m4b-tool merge "$src" \
          --output-file "$stage/$name.m4b" \
          --jobs "$JOBS" \
          --no-cache \
          --force \
          "$@"; then
        # Carry sidecars through for beets-audible / filetote to pick up.
        if [ -d "$src" ]; then
          for extra in cover.jpg cover.png folder.jpg metadata.opf desc.txt reader.txt; do
            [ -f "$src/$extra" ] && cp "$src/$extra" "$stage/" || true
          done
        fi
        # Relocate the finished book to NFS. It is a freshly built inode, so a
        # copy is correct (nothing to hardlink); cp without -p avoids the chown
        # a root-squashed export would reject. beets skips the hidden .part
        # dir until publish() reveals it via an atomic NFS->NFS rename.
        mkdir -p "$work"
        if cp -r "$stage/." "$work/"; then
          rm -rf "$stage"
          publish "$work" "$name"
          rm -rf "$src"
          log "done: $name"
        else
          rm -rf "$work" "$stage"
          fail "$src" "$name"
        fi
      else
        rm -rf "$work" "$stage"
        fail "$src" "$name"
      fi
    }

    passthrough() {
      # A single, already-final M4B — nothing to merge or transcode. Same
      # filesystem, so this is a rename that preserves the hardlink.
      src=$1
      name=$2
      work="$OUT/.$name.part"
      rm -rf "$work"
      if [ -d "$src" ]; then
        mv "$src" "$work"
      else
        mkdir -p "$work"
        mv "$src" "$work/"
      fi
      publish "$work" "$name"
      log "passthrough: $name"
    }

    # process_flat <dir> <name> — a directory with audio directly inside it.
    process_flat() {
      if has_ext "$1" mp3; then
        do_merge "$1" "$2" transcode
      elif [ "$(count_m4b "$1")" -gt 1 ]; then
        do_merge "$1" "$2" copy
      else
        passthrough "$1" "$2"
      fi
    }

    # immediate subdirs of $1 that DIRECTLY contain audio (one per line)
    audio_subdirs() {
      for d in "$1"/*/; do
        [ -d "$d" ] || continue
        if has_audio_flat "${d%/}"; then printf '%s\n' "${d%/}"; fi
      done
    }

    # handle_nested <dir> <name> — audio lives in subfolders, not directly here.
    # Decide via album tags: same album across subfolders => one book split into
    # discs/parts (consolidate + merge); distinct albums => separate books
    # (flatten each up one level); anything unclear => quarantine to review/.
    handle_nested() {
      src=$1
      name=$2
      subs=$(audio_subdirs "$src")
      n=$(printf '%s\n' "$subs" | sed '/^$/d' | wc -l | tr -d ' ')

      if [ "$n" -eq 0 ]; then
        # audio is nested deeper than one level — too irregular to auto-handle
        review "$src" "$name"
        return
      fi

      if [ "$n" -eq 1 ]; then
        # one book one level deep: pull its contents up, then treat as flat
        find "$subs" -maxdepth 1 -mindepth 1 -exec mv {} "$src"/ \; 2>/dev/null || true
        rmdir "$subs" 2>/dev/null || true
        log "flattened single nested book: $name"
        process_flat "$src" "$name"
        return
      fi

      # n >= 2: compare album tags across the subfolders. One line per subfolder
      # (album_of always emits a line) written to a temp file so command-substn
      # newline trimming can't hide an empty (unreadable) album.
      albf="$STAGE/.nested-albums"
      printf '%s\n' "$subs" | while IFS= read -r d; do
        [ -n "$d" ] || continue
        f=$(find "$d" -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.m4b' -o -iname '*.m4a' \) 2>/dev/null | sort | head -n1)
        album_of "$f"
      done > "$albf"

      if [ "$(grep -c . "$albf")" -lt "$n" ]; then
        # a subfolder had no readable album — don't guess
        review "$src" "$name"
        return
      fi

      if [ "$(sort -u "$albf" | grep -c .)" -eq 1 ]; then
        # all one album => discs/parts of a single book. Consolidate every
        # file up, prefixing the subfolder name so disc order is preserved.
        printf '%s\n' "$subs" | while IFS= read -r d; do
          [ -n "$d" ] || continue
          sub=$(basename "$d")
          find "$d" -maxdepth 1 -type f -exec sh -c \
            'mv "$3" "$1/$2 - $(basename "$3")"' _ "$src" "$sub" {} \;
          rmdir "$d" 2>/dev/null || true
        done
        log "consolidated multi-disc book: $name"
        process_flat "$src" "$name"
        return
      fi

      # distinct albums => separate books. Flatten each subfolder up one level
      # as its own top-level ingest item (reprocessed on the next run).
      printf '%s\n' "$subs" | while IFS= read -r d; do
        [ -n "$d" ] || continue
        sub=$(basename "$d")
        rm -rf "$IN/$name - $sub"
        mv "$d" "$IN/$name - $sub"
        log "split nested book -> $name - $sub"
      done
      rm -rf "$src"
    }

    found=0
    for src in "$IN"/*; do
      [ -e "$src" ] || continue
      name=$(basename "$src")
      case "$name" in .*) continue ;; esac
      found=$((found + 1))

      # Some torrents are a single bare audio file. Wrap it in a same-named
      # directory so the directory logic below handles it uniformly (m4b-tool's
      # merge wants a directory, not a file). A bare non-audio file just fails.
      if [ -f "$src" ]; then
        case "$name" in
          *.m4b|*.M4B|*.m4a|*.M4A|*.mp3|*.MP3)
            base=${name%.*}
            dir="$IN/$base"
            mkdir -p "$dir"
            mv "$src" "$dir/"
            src="$dir"
            name="$base"
            log "wrapped bare file into dir: $name"
            ;;
          *)
            fail "$src" "$name"
            continue
            ;;
        esac
      fi

      # Directory handling. Bare files were wrapped above, so $src is a dir.
      if has_audio_flat "$src"; then
        # Audio directly here: a normal single book.
        process_flat "$src" "$name"
      elif has_audio_anywhere "$src"; then
        # Audio only in subfolders: multi-disc book or several books.
        handle_nested "$src" "$name"
      else
        log "no audio found in: $name"
        fail "$src" "$name"
      fi
    done

    log "done, $found item(s) examined"

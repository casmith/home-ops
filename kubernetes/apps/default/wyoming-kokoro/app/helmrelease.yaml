---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wyoming-kokoro
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: wyoming-kokoro
  interval: 30m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

  values:
    defaultPodOptions:
      # amd64 for the same reason as Piper and Whisper: this is CPU inference
      # and the arm64 Pi workers are the memory-tight nodes.
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

    controllers:
      wyoming-kokoro:
        replicas: 1
        strategy: Recreate
        containers:
          # Wyoming <-> OpenAI bridge. Home Assistant speaks Wyoming natively,
          # so this is what lets Kokoro appear next to Piper and Whisper as an
          # ordinary Wyoming service — no HACS component, no custom_components
          # to vendor, nothing outside GitOps.
          app:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: "0.5.0"
            env:
              TZ: America/Chicago
              WYOMING_URI: tcp://0.0.0.0:10300
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: en
              # Same pod, so the sidecar is on loopback and never leaves the
              # network namespace.
              TTS_OPENAI_URL: http://localhost:8880/v1
              TTS_MODELS: kokoro
              TTS_BACKEND: KOKORO_FASTAPI
              # THE setting that keeps voice responsive. Without it the bridge
              # waits for the whole reply to synthesise before emitting any
              # audio; with it, pySBD splits on sentence boundaries and the
              # first sentence starts playing while the rest is still being
              # produced. Jarvis's answers are short, but "the office lights
              # are on" should not wait on a trailing clause.
              TTS_STREAMING_MODELS: kokoro
              # Every current English voice, so they all appear in the
              # Home Assistant voice picker and can be auditioned without a
              # redeploy. The bridge advertises exactly what is listed here —
              # naming a single voice leaves HA with a one-entry dropdown and
              # no way to try anything else.
              #
              # bm_daniel leads: British male RP, the one Clay settled on after
              # comparing the British male set. bm_george was the first pick and
              # is still here.
              #
              # This list is only what is *offered*. The voice actually spoken
              # is the pipeline's `tts_voice`, set per assistant in Settings ->
              # Voice assistants and stored in Home Assistant's own database,
              # not here — so changing this order does not change what you
              # hear. Both pipelines are on bm_daniel.
              #
              # English-only on purpose. Kokoro also ships Japanese, Mandarin,
              # Spanish, French, Hindi, Italian and Portuguese voices, which
              # would bury the useful ones under ~30 more entries. The legacy
              # v0 variants are omitted as superseded duplicates.
              #
              # Weighted blends work too, e.g. "bm_daniel(0.7)+bm_george(0.3)",
              # if a point between two voices sits better than either.
              TTS_VOICES: >-
                bm_daniel bm_george bm_lewis bm_fable
                bf_alice bf_emma bf_isabella bf_lily
                am_adam am_echo am_eric am_fenrir am_liam am_michael
                am_onyx am_puck am_santa
                af_heart af_alloy af_aoede af_bella af_jadzia af_jessica
                af_kore af_nicole af_nova af_river af_sarah af_sky
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 10300
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

          # Kokoro-82M itself, CPU build. Deliberately NOT the GPU image: the
          # RTX 3090 Ti is at 18.6 GiB of 23 GiB serving qwen3.6:27b for
          # Jarvis, and a second CUDA consumer would evict the LLM — the exact
          # thrash that made spoken replies take 30s before. Kokoro is 82M
          # parameters and synthesises faster than real time on these cores.
          kokoro:
            image:
              repository: ghcr.io/remsky/kokoro-fastapi-cpu
              tag: "v0.8.0"
            env:
              TZ: America/Chicago
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  initialDelaySeconds: 15
                  periodSeconds: 5
                  # Generous: first start loads the ONNX voice pack.
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                # Synthesis is bursty and short; let it use several cores for
                # the fraction of a second it needs rather than stretching a
                # sentence out against a tight quota.
                cpu: 4
                memory: 4Gi

    service:
      app:
        # ClusterIP, like Piper. Only Home Assistant talks to this and the
        # Wyoming protocol is unauthenticated — it must not be routed or
        # load-balanced onto the LAN.
        controller: *app
        ports:
          wyoming:
            port: *port

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dashboard
  namespace: default
spec:
  chartRef:
    kind: OCIRepository
    name: dashboard
  interval: 30m

  values:
    controllers:
      dashboard:
        annotations:
          # ConfigMaps are generated without a name-suffix hash, so their
          # content changes in place; reloader is what actually rolls the pod.
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: 1.31-alpine
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: dashboard
        ports:
          http:
            port: *port

    # No direct route: dashboard is exposed only via the Authentik embedded
    # proxy outpost. See ./httproute.yaml, which sends dash.kalde.in to
    # authentik-server. The page maps the whole estate, so it is gated like
    # homepage rather than served open on the internal gateway.

    persistence:
      nginx-config:
        type: configMap
        name: dashboard-nginx
        globalMounts:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
      content:
        type: configMap
        name: dashboard-content
        # Mounted as a directory, not subPath, so an edited page reaches the
        # running pod through the kubelet's ConfigMap sync as well.
        globalMounts:
          - path: /usr/share/nginx/html
            readOnly: true

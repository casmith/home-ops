<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>Elmdon Homelab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#070a0e; --panel:#0d1218; --panel-2:#111922;
  --line:#1b242e; --line-hi:#2a3846;
  --tx:#c6d0da; --dim:#63717f; --faint:#3c4855;
  --k8s:#3ee0d4; --calypso:#ff4d8f; --magnus:#f5a623;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --disp:"Chakra Petch","IBM Plex Mono",ui-monospace,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:var(--mono); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -10%, rgba(62,224,212,.055), transparent 60%),
    repeating-linear-gradient(to bottom, rgba(255,255,255,.016) 0 1px, transparent 1px 3px);
}
.wrap{position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:0 20px 88px}

/* ---- command bar ---- */
.bar{
  position:sticky; top:0; z-index:5;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:14px 0 13px; margin-bottom:34px;
  border-bottom:1px solid var(--line);
  background:rgba(7,10,14,.92); backdrop-filter:blur(8px);
}
.mark{font-family:var(--disp); font-size:15px; letter-spacing:.16em; color:var(--tx); white-space:nowrap}
.mark span{color:var(--k8s)}
.cursor{display:inline-block; width:8px; height:14px; background:var(--k8s); vertical-align:-2px; margin-left:6px; animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.field{position:relative; flex:1 1 260px; min-width:200px}
.field::before{content:"/"; position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px}
#q{
  width:100%; padding:8px 12px 8px 26px;
  background:var(--panel); color:var(--tx); font:400 13px/1.4 var(--mono);
  border:1px solid var(--line); border-radius:0; outline:none;
}
#q::placeholder{color:var(--faint)}
#q:focus{border-color:var(--line-hi); background:var(--panel-2)}
#q:focus-visible{outline:1px solid var(--k8s); outline-offset:1px}
.tally{font-size:12px; color:var(--dim); letter-spacing:.06em; white-space:nowrap; font-variant-numeric:tabular-nums}
.tally b{color:var(--tx); font-weight:500}
.key{
  display:inline-flex; align-items:center; padding:1px 5px; margin:0 2px;
  border:1px solid var(--line-hi); color:var(--dim); font-size:11px;
}

/* ---- site ---- */
.site{margin-bottom:56px}
.site[hidden]{display:none}
.site-head{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding-bottom:9px; border-bottom:1px solid var(--ac); margin-bottom:4px}
.site-name{font-family:var(--disp); font-size:26px; letter-spacing:.05em; color:var(--ac); margin:0; line-height:1}
.site-kick{font-family:var(--disp); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--dim)}
.site-meta{margin-left:auto; font-size:12px; color:var(--dim)}
.site-rule{height:1px; background:linear-gradient(to right,var(--ac),transparent 42%); opacity:.35; margin-bottom:26px}

/* ---- group ---- */
.group{margin-bottom:26px}
.group[hidden]{display:none}
.group-head{display:flex; align-items:baseline; gap:12px; margin-bottom:9px}
.group-label{font-family:var(--disp); font-size:11px; letter-spacing:.19em; text-transform:uppercase; color:var(--tx)}
.group-meta{font-size:11.5px; color:var(--faint)}
.group-head::after{content:""; flex:1; height:1px; background:var(--line)}

/* ---- tiles ---- */
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:7px}
.tile{
  display:block; position:relative; text-decoration:none; color:inherit;
  padding:11px 13px 10px; background:var(--panel); border:1px solid var(--line);
  transition:background .12s linear, border-color .12s linear;
}
.tile[hidden]{display:none}
.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--ac); opacity:0; transition:opacity .12s linear}
a.tile:hover, a.tile:focus-visible{background:var(--panel-2); border-color:var(--ac); outline:none}
a.tile:hover::before, a.tile:focus-visible::before{opacity:1}
a.tile:hover .t-name, a.tile:focus-visible .t-name{color:var(--ac)}
.t-top{display:flex; align-items:center; gap:8px}
.t-name{font-weight:500; font-size:13.5px; color:var(--tx); transition:color .12s linear}
.t-desc{font-size:12px; color:var(--dim); margin-top:1px}
.t-host{font-size:11.5px; color:var(--faint); margin-top:5px; word-break:break-all}
.badge{
  margin-left:auto; font-family:var(--disp); font-size:9.5px; letter-spacing:.13em;
  padding:1px 5px; border:1px solid var(--line-hi); color:var(--dim); white-space:nowrap;
}
.badge.sso{color:var(--ac); border-color:color-mix(in srgb,var(--ac) 40%,transparent)}

/* ---- chips ---- */
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{
  padding:3px 8px; background:var(--panel); border:1px solid var(--line);
  font-size:11.5px; color:var(--dim); white-space:nowrap;
}
.chip[hidden]{display:none}
.chip b{color:var(--tx); font-weight:400}
.chip i{font-style:normal; color:var(--faint)}

.empty{padding:34px 0; color:var(--dim); font-size:13px}
.empty[hidden]{display:none}
footer{margin-top:10px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--faint); display:flex; gap:18px; flex-wrap:wrap}
.dot{display:inline-block; width:7px; height:7px; margin-right:6px; vertical-align:1px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}
</style>
</head>
<body>

<div class="wrap">

    <div class="tally" id="tally"></div>
    <div class="tally"><span class="key">/</span>focus <span class="key">esc</span>clear</div>
  </header>
  <main id="out"></main>
  <p class="empty" id="empty" hidden>No service matches that filter.</p>
  <footer>
    <span><i class="dot" style="background:var(--k8s)"></i>kubernetes · kalde.in</span>
    <span><i class="dot" style="background:var(--calypso)"></i>calypso-deploy · local.kalde.in</span>
    <span><i class="dot" style="background:var(--magnus)"></i>magnus-deploy · doughme.in</span>
    <span style="margin-left:auto">generated from home-ops, calypso-deploy, magnus-deploy</span>
  </footer>
</div>

const out=document.getElementById("out");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let html="";
for(const s of SITES){
  html+=`<section class="site" data-site style="--ac:${s.ac}">
    <div class="site-head"><h2 class="site-name">${s.name}</h2><span class="site-kick">${esc(s.kick)}</span><span class="site-meta">${esc(s.meta)}</span></div>
    <div class="site-rule"></div>`;
  for(const g of s.groups){
    html+=`<div class="group" data-group><div class="group-head"><span class="group-label">${esc(g.label)}</span><span class="group-meta">${esc(g.meta)}</span></div>`;
    if(g.mode==="tile"){
      html+=`<div class="tiles">`;
      for(const [n,u,d,b] of g.items){
        const key=esc((n+" "+d+" "+u+" "+g.label+" "+g.meta).toLowerCase());
        const host=u?u.replace(/^https?:\/\//,""):"";
        const badge=b?`<span class="badge${b==="SSO"?" sso":""}">${esc(b)}</span>`:"";
        const inner=`<div class="t-top"><span class="t-name">${esc(n)}</span>${badge}</div>
          <div class="t-desc">${esc(d)}</div>${host?`<div class="t-host">${esc(host)}</div>`:""}`;
        html+=u?`<a class="tile" data-item data-k="${key}" href="${esc(u)}" target="_blank" rel="noopener">${inner}</a>`
               :`<div class="tile" data-item data-k="${key}">${inner}</div>`;
      }
      html+=`</div>`;
    }else{
      html+=`<div class="chips">`;
      for(const [n,d] of g.items){
        const key=esc((n+" "+d+" "+g.label).toLowerCase());
        html+=`<span class="chip" data-item data-k="${key}" title="${esc(d)}"><b>${esc(n)}</b> <i>${esc(d)}</i></span>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  }
  html+=`</section>`;
}
out.innerHTML=html;

const items=[...out.querySelectorAll("[data-item]")];
const groups=[...out.querySelectorAll("[data-group]")];
const sites=[...out.querySelectorAll("[data-site]")];
const q=document.getElementById("q"), tally=document.getElementById("tally"), empty=document.getElementById("empty");
const TOTAL=items.length;

function apply(){
  const t=q.value.trim().toLowerCase();
  let n=0;
  for(const el of items){
    const hit=!t||el.dataset.k.includes(t);
    el.hidden=!hit; if(hit)n++;
  }
  for(const g of groups) g.hidden=!g.querySelector("[data-item]:not([hidden])");
  for(const s of sites) s.hidden=!s.querySelector("[data-group]:not([hidden])");
  empty.hidden=n>0;
  tally.innerHTML=t?`<b>${n}</b> / ${TOTAL} services`:`<b>${TOTAL}</b> services · ${sites.length} sites`;
}
q.addEventListener("input",apply);
addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();q.select();}
  else if(e.key==="Escape"){q.value="";apply();q.blur();}
});
apply();
</script>
</body>
</html>

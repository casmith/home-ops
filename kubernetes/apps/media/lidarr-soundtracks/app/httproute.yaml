---
# Fronted by the Authentik embedded proxy outpost, same as lidarr: route the
# public host to authentik-server (security ns), which authenticates and then
# proxies to the lidarr-soundtracks Service internally. See
# ../../lidarr/app/httproute.yaml for the full rationale.
# yaml-language-server: $schema=https://github.com/datreeio/CRDs-catalog/raw/refs/heads/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr-soundtracks-auth
  namespace: media
spec:
  hostnames:
    - lidarr-soundtracks.kalde.in
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
    - name: internal
      namespace: kube-system
      sectionName: https
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: security
          port: 80

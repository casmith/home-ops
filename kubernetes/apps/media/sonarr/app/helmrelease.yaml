---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sonarr
  namespace: media
spec:
  interval: 15m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: sonarr

  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5

  values:
    initContainers:
      - name: 01-init-db
        image: ghcr.io/home-operations/postgres-init:18.6
        imagePullPolicy: IfNotPresent
        envFrom:
          - secretRef:
              name: sonarr-secret

    controllers:
      sonarr:
        pod:
          securityContext:
            runAsUser: 1026
            runAsGroup: 65537
            fsGroup: 65537
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 100
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 5.0.0.2941
            env:
              TZ: America/Chicago
              SONARR__INSTANCE_NAME: Sonarr
              SONARR__PORT: &port 80
              SONARR__APPLICATION_URL: "https://{{ .Release.Name }}.kalde.in"
              SONARR__LOG_LEVEL: info
              # Authentik forward-auth is the login (see httproute.yaml). Sonarr v5
              # refuses the local-address bypass when X-Forwarded-For is present,
              # so Forms auth would prompt behind the outpost.
              SONARR__AUTH__METHOD: External
            envFrom:
              - secretRef:
                  name: sonarr-secret
            resources:
              requests:
                memory: 500Mi
                cpu: "1.5"
              limits:
                memory: 500Mi
                cpu: "3"

    service:
      app:
        ports:
          http:
            port: *port

    # No direct route: sonarr has no OIDC, so the UI is exposed only via the
    # Authentik embedded proxy outpost. See ./httproute.yaml (sonarr-auth),
    # which sends sonarr.kalde.in to authentik-server. The API stays reachable
    # in-cluster via the sonarr Service (Seerr/Homepage use svc DNS), and the
    # outpost forwards from a local IP so sonarr's DisabledForLocalAddresses
    # auth bypasses — no double-login.

    persistence:
      config:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume1/cluster/sonarr
        globalMounts:
          - path: /config
      downloads:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume1/downloads/complete/tv
        globalMounts:
          - path: /downloads
      tv:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume2/share/videos/tv
        globalMounts:
          - path: /tv
      tv-archive:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume1/share2/tv
        globalMounts:
          - path: /tv-archive
      backup:
        enabled: true
        type: nfs
        server: 192.168.10.3
        path: /volume1/cluster/backup/sonarr
        globalMounts:
          - path: /backup

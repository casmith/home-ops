---
# Dedicated Postgres for Khaos News (needs pgvector). The CloudNativePG
# "standard" image ships pgvector, so no VectorChord image is needed; only
# `vector` is used here, so no shared_preload_libraries.
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: khaos-news
  namespace: database
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-bookworm@sha256:0d0e407ca1d986022651671e830022ccfe496994a8b99fe925b5ae3f0264cb1a
  inheritedMetadata:
    labels:
      kube-image-keeper.enix.io/image-caching-policy: ignore
  primaryUpdateStrategy: unsupervised
  # Promote an already-updated replica rather than restarting the primary
  # in place: seconds of write unavailability instead of about a minute.
  primaryUpdateMethod: switchover
  storage:
    size: 10Gi
    storageClass: local-path
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: khaos_news
      owner: khaos_news
      secret:
        name: khaos-news-db-owner
      # CNPG runs this as superuser, so the app never needs extension privileges.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  monitoring:
    enablePodMonitor: true

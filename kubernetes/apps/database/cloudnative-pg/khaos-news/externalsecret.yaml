---
# Owner credentials for the khaos_news database (CNPG initdb). The app reads the
# same password via its own ExternalSecret in the default namespace.
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: khaos-news-db-owner
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: khaos-news-db-owner
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: khaos_news
        password: "{{ .POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: khaos-news

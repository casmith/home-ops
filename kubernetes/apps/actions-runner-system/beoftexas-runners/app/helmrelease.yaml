---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: beoftexas-runners
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: beoftexas-runners
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: beoftexas-runners-secret
      valuesKey: github_app_id
      targetPath: githubConfigSecret.github_app_id
    - kind: Secret
      name: beoftexas-runners-secret
      valuesKey: github_app_installation_id
      targetPath: githubConfigSecret.github_app_installation_id
    - kind: Secret
      name: beoftexas-runners-secret
      valuesKey: github_app_private_key
      targetPath: githubConfigSecret.github_app_private_key
  values:
    # Repository-level runner pool for beoftexas
    githubConfigUrl: https://github.com/casmith/beoftexas

    # Scaling configuration
    minRunners: 1
    maxRunners: 3

    # Runner template
    template:
      spec:
        nodeSelector:
          kubernetes.io/arch: amd64
        initContainers:
          # glibc initialises resolver state once per process. A runner that
          # starts while the pod's DNS path is not yet programmed caches that
          # failure and retries forever without ever re-reading resolv.conf --
          # the pod looks healthy, the job sits queued, and nothing recovers.
          # Hold the runner until resolution demonstrably works from this pod.
          #
          # nslookup, not getent: busybox ships no getent, so the first attempt
          # at this guard could never succeed and failed every runner in the
          # cluster. Verified in busybox:1.36 -- exit 0 when resolution works,
          # exit 1 against a blackhole resolver.
          - name: wait-for-dns
            image: busybox:1.36
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  if nslookup github.com >/dev/null 2>&1; then
                    echo "dns ready after $(( (i - 1) * 2 ))s"
                    exit 0
                  fi
                  sleep 2
                done
                echo "dns never became usable; failing so the pod is replaced"
                exit 1
        containers:
          - name: runner
            image: ghcr.io/khaoslabs/actions-runner:2026-07-29-e95765
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: DOCKER_HOST
                value: tcp://localhost:2375
            resources:
              requests:
                memory: 1Gi
                cpu: 500m
              limits:
                memory: 2Gi
                cpu: 2000m
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dshm
                mountPath: /dev/shm
          - name: dind
            image: docker:dind
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: ""
            resources:
              requests:
                memory: 512Mi
                cpu: 500m
              limits:
                memory: 1Gi
                cpu: 1000m
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              # subPath so we drop daemon.json in without masking the rest of
              # /etc/docker, which the dind image populates itself.
              - name: dind-config
                mountPath: /etc/docker/daemon.json
                subPath: daemon.json
                readOnly: true

        # Storage for runner work directory
        volumes:
          - name: dind-config
            configMap:
              name: beoftexas-runners-dind-config
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: 10Gi

    # Controller settings
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller

---
# Identity for home-ops-runners-amd64 jobs. Read-only access to pods lets the
# CVE Scan workflow list the images actually running in the cluster, which
# includes images Helm charts set by default and never appear in this repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-ops-runners-amd64
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: home-ops-runners-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: home-ops-runners-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: home-ops-runners-pod-reader
subjects:
  - kind: ServiceAccount
    name: home-ops-runners-amd64
    namespace: actions-runner-system

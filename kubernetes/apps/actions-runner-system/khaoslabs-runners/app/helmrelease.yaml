---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: khaoslabs-runners
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: khaoslabs-runners
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: khaoslabs-runners-secret
      valuesKey: github_app_id
      targetPath: githubConfigSecret.github_app_id
    - kind: Secret
      name: khaoslabs-runners-secret
      valuesKey: github_app_installation_id
      targetPath: githubConfigSecret.github_app_installation_id
    - kind: Secret
      name: khaoslabs-runners-secret
      valuesKey: github_app_private_key
      targetPath: githubConfigSecret.github_app_private_key
  values:
    # Organization-level runner pool for khaoslabs
    githubConfigUrl: https://github.com/khaoslabs

    # Scaling configuration
    minRunners: 1
    maxRunners: 5

    # Runner template
    template:
      spec:
        # k8s-pi-1..4 are the 4GB Pis. They boot from USB flash and have no
        # memory headroom: a runner landing there drives the page cache below
        # the working set, and with no swap the kernel evicts file pages that
        # are immediately re-faulted from disk. That thrash saturates the USB
        # bus (96% busy, 665 reads/s, 74% iowait), kubelet housekeeping blows
        # past its 1s budget, and the node flaps NodeNotReady. Observed on
        # k8s-pi-4 on 2026-08-18 with two runners resident.
        #
        # NotIn on hostname rather than a node label: the 4GB/8GB split is
        # currently only expressed in comments in talos/nodes/workers/, and
        # adding a real label means re-applying all 11 machine configs. Worth
        # doing separately; this lands without a Talos apply.
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values: ["k8s-pi-1", "k8s-pi-2", "k8s-pi-3", "k8s-pi-4"]
        initContainers:
          # glibc initialises resolver state once per process. A runner that
          # starts while the pod's DNS path is not yet programmed caches that
          # failure and retries forever without ever re-reading resolv.conf --
          # the pod looks healthy, the job sits queued, and nothing recovers.
          # Hold the runner until resolution demonstrably works from this pod.
          #
          # nslookup, not getent: busybox ships no getent, so the first attempt
          # at this guard could never succeed and failed every runner in the
          # cluster. Verified in busybox:1.36 -- exit 0 when resolution works,
          # exit 1 against a blackhole resolver.
          - name: wait-for-dns
            image: busybox:1.38
            command:
              - sh
              - -c
              - |
                for i in $(seq 1 60); do
                  if nslookup github.com >/dev/null 2>&1; then
                    echo "dns ready after $(( (i - 1) * 2 ))s"
                    exit 0
                  fi
                  sleep 2
                done
                echo "dns never became usable; failing so the pod is replaced"
                exit 1
        containers:
          - name: runner
            image: ghcr.io/khaoslabs/actions-runner:2026-08-17-3e46a8
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
            resources:
              requests:
                memory: 512Mi
                cpu: 200m
              limits:
                memory: 1Gi
                cpu: 1000m
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work

        # Storage for runner work directory
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  storageClassName: local-path
                  resources:
                    requests:
                      storage: 10Gi

    # Controller settings
    controllerServiceAccount:
      namespace: actions-runner-system
      name: actions-runner-controller

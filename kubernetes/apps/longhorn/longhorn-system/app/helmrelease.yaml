---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  releaseName: longhorn
  interval: 5m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: longhorn-system
      interval: 5m
  values:
    longhornManager:
      # Without these the manager has no requests at all, so it lands in the
      # BestEffort QoS class. Talos runs its own userspace OOM controller which
      # SIGKILLs whole cgroups under /sys/fs/cgroup/kubepods/besteffort when a
      # node is short on memory — it took out longhorn-manager on k8s-pi-3
      # repeatedly. That kill is invisible to Kubernetes: containerd never sees
      # an OOM event, so the container reports reason=Error rather than
      # OOMKilled, no eviction event is emitted, and the node still reports
      # MemoryPressure=False. Requests move it to Burstable so it is no longer
      # in the first group Talos sweeps.
      #
      # Sized from observed steady state across the 11 managers: 242-335Mi,
      # 15-167m CPU.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    # Declarative backup target. The chart owns the `default` BackupTarget CR,
    # so this keeps the setting in git instead of the UI. NFS needs no creds.
    defaultBackupStore:
      backupTarget: nfs://192.168.10.3:/volume1/cluster/backup/longhorn
      backupTargetCredentialSecret: ""
      pollInterval: 300
    persistence:
      # numberOfReplicas on the default `longhorn` StorageClass (new PVCs).
      defaultClassReplicaCount: 3
      # Bind every new volume from the default StorageClass to the backup job's
      # group so it is automatically backed up.
      recurringJobSelector:
        enable: true
        jobList: '[{"name":"default","isGroup":true}]'
    defaultSettings:
      # NOTE: do not set defaultReplicaCount here. It is DataEngineSpecific, so
      # Longhorn stores it as {"v1":"3","v2":"3"} while this file would supply a
      # scalar. shouldApplyCustomizedSettingValue compares those as raw strings,
      # never matches, and so rewrites the Setting on every manager start —
      # and UpdateSetting's first write is not wrapped in RetryOnConflict, so a
      # racing manager fataly exits (daemon.go:111) and crashloops. The built-in
      # default is already {"v1":"3","v2":"3"} (types/setting.go:809), so this
      # was redundant anyway. Any DataEngineSpecific setting added here must use
      # the JSON form, as disable-revision-counter below does.
      # Same BestEffort problem as longhornManager above, for the components
      # the chart does not expose. The CSI deployments, the csi-plugin
      # DaemonSet and its two sidecars are created at runtime by
      # longhorn-driver-deployer, not by Helm, so they carry no requests and
      # no chart value or postRenderer can reach them -- this setting is the
      # only thing that does. They sat in BestEffort with longhorn-critical
      # priority, which the Talos OOM controller ignores (it keys on the
      # cgroup QoS tier), so a leaking node took out the CSI plugin over and
      # over: 111 restarts on k8s-pi-6, 90 on k8s-cp-1 by 2026-09-18.
      #
      # Requests only, deliberately. The goal is to leave BestEffort, and a
      # memory limit on the CSI data path risks an OOMKill during a replica
      # rebuild storm -- which is why this diverges from the 512Mi limit on
      # longhornManager. Sized ~2x observed peak: attacher 41Mi, provisioner
      # 47Mi, resizer 45Mi, snapshotter 34Mi, csi-plugin 34Mi,
      # node-driver-registrar 21Mi, liveness-probe 24Mi.
      #
      # Applying this restarts the CSI components, which briefly pauses
      # provisioning and attach/detach.
      systemManagedCSIComponentsResourceLimits: >-
        {"csi-attacher": {"requests": {"cpu": "10m", "memory": "64Mi"}},
        "csi-provisioner": {"requests": {"cpu": "10m", "memory": "64Mi"}},
        "csi-resizer": {"requests": {"cpu": "10m", "memory": "64Mi"}},
        "csi-snapshotter": {"requests": {"cpu": "10m", "memory": "64Mi"}},
        "longhorn-csi-plugin": {"requests": {"cpu": "10m", "memory": "64Mi"}},
        "node-driver-registrar": {"requests": {"cpu": "10m", "memory": "32Mi"}},
        "longhorn-liveness-probe": {"requests": {"cpu": "10m", "memory": "32Mi"}}}
      defaultLonghornStaticStorageClass: longhorn
      # Only create a default disk (i.e. store replica data) on nodes labeled
      # node.longhorn.io/create-default-disk=true — the amd64 cp nodes. Keeps
      # Longhorn storage off the arm64 Pi nodes (which still run general
      # workloads + can mount volumes, just never host replicas).
      createDefaultDiskLabeledNodes: true
      # Auto-roll volume engines to the default image after a manager upgrade
      # (max 3/node, live + health-checked). Keeps stale engine-image
      # DaemonSets from piling up on every node. 0 = disabled (the default).
      concurrentAutomaticEngineUpgradePerNodeLimit: 3
    longhornUI:
      replicas: 1  # built-in UI; exposed via HTTPRoute, not the chart ingress
    ingress:
      enabled: false

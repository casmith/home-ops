---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: coredns
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    servers:
      # Forward kalde.in queries to Pi-hole for split-horizon DNS.
      # Both Pi-holes are listed -- cerritos (primary) and saopaulo (secondary),
      # matching what Kea hands out -- so losing one host does not take internal
      # name resolution down with it. They serve identical records: the primary
      # owns them and rsyncs to the secondary every 30min (calypso-deploy's
      # setup-pihole-secondary.yaml).
      - zones:
          - zone: kalde.in
            scheme: dns://
        port: 53
        plugins:
          - name: errors
          - name: cache
            parameters: 30
          - name: forward
            parameters: . 192.168.8.10 192.168.8.11
          - name: log
            configBlock: |-
              class error
      # Default zone for all other queries
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          # This cluster is IPv4-only: clusterPodNets is 10.42.0.0/16 with
          # single-stack Cilium, and pod netns have net.ipv6.conf.all.disable_ipv6=1
          # with no address in /proc/net/if_inet6. No AAAA we hand out is ever
          # reachable.
          #
          # glibc and musl already hide AAAA from applications via AI_ADDRCONFIG
          # when the netns has no IPv6 address, which is why curl/git/nslookup
          # were never affected. But Go binaries built with CGO_ENABLED=0 -- Flux,
          # Renovate, dockerd, containerd -- use Go's own resolver, which does not
          # implement AI_ADDRCONFIG. They query AAAA directly, get an address they
          # cannot route to, and fail with "connect: network is unreachable".
          # Observed as intermittent Docker Hub blob-pull failures on the runners
          # against production.cloudfront.docker.com, which returns 9 AAAA records.
          #
          # NOERROR with no answer section is NODATA: "this name has no AAAA",
          # which is the truthful answer here. No fallthrough -- the point is that
          # nothing downstream ever produces one. Remove this block if the cluster
          # ever gains real IPv6.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

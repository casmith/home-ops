---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap the Talos cluster
    dir: '{{.TALOS_DIR}}'
    cmds:
      - '[ -f talsecret.sops.yaml ] || talosctl gen secrets -o - | sops --filename-override talos/talsecret.sops.yaml --encrypt /dev/stdin > talsecret.sops.yaml'
      - task: :talos:generate-config
      # topf applies to nodes in maintenance mode without --insecure, then bootstraps etcd once.
      - topf apply --auto-bootstrap --confirm=false
      - until talosctl kubeconfig {{.ROOT_DIR}} --nodes {{.CONTROL_PLANE_IP}} --force; do sleep 10; done
    vars:
      CONTROL_PLANE_IP:
        sh: yq '[.nodes[] | select(.role == "control-plane") | .ip] | .[0]' {{.TALOS_DIR}}/topf.yaml
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - test -f {{.TALOS_DIR}}/topf.yaml
      - which topf talosctl sops yq

  apps:
    desc: Bootstrap apps into the Talos cluster
    cmd: bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBECONFIG}}
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}

---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

# Nodes are addressed by hostname rather than IP. render.sh resolves the
# address from the node file, so the hostname is the only thing worth typing --
# and it is what `kubectl get nodes` and the workflows already use.
#
# render.sh is run through `bash` rather than executed directly, matching how
# bootstrap:apps runs scripts/bootstrap-apps.sh.

vars:
  RENDER: 'bash {{.ROOT_DIR}}/talos/render.sh'

tasks:

  generate-config:
    desc: Render every node's Talos configuration into clusterconfig/
    dir: '{{.TALOS_DIR}}'
    cmds:
      - mkdir -p clusterconfig
      - for: {var: NODES}
        cmd: '{{.RENDER}} config {{.ITEM}} > clusterconfig/kubernetes-{{.ITEM}}.yaml'
      - '{{.RENDER}} talosconfig > clusterconfig/talosconfig'
    vars:
      NODES:
        sh: '{{.RENDER}} nodes'
    preconditions:
      - test -f {{.TALOS_DIR}}/render.sh
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talosctl sops yq jq curl

  render-config:
    desc: Print a node's Talos configuration [NODE=required]
    dir: '{{.TALOS_DIR}}'
    cmd: '{{.RENDER}} config {{.NODE}}'
    requires:
      vars: [NODE]
    preconditions:
      - which talosctl sops yq jq curl

  apply-node:
    desc: Apply Talos config to a node [NODE=required]
    dir: '{{.TALOS_DIR}}'
    cmd: '{{.RENDER}} config {{.NODE}} | talosctl --nodes {{.IP}} apply-config --file /dev/stdin --mode={{.MODE}}'
    vars:
      MODE: '{{.MODE | default "auto"}}'
      IP:
        sh: '{{.RENDER}} ip {{.NODE}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl sops yq jq curl

  upgrade-node:
    desc: Upgrade Talos on a single node [NODE=required]
    dir: '{{.TALOS_DIR}}'
    # No drain here. talosctl's single-pass eviction deadlocks against the
    # Longhorn instance-manager PDB -- see UPGRADE.md. Drain by hand first, or
    # use the Talos Upgrade workflow, which does it properly.
    cmd: talosctl --nodes {{.IP}} upgrade --image {{.IMAGE}} --timeout=10m
    vars:
      IP:
        sh: '{{.RENDER}} ip {{.NODE}}'
      IMAGE:
        sh: '{{.RENDER}} image {{.NODE}}'
    requires:
      vars: [NODE]
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talosctl yq jq curl

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: '{{.TALOS_DIR}}'
    # One cluster-wide command: talosctl rolls the control plane static pods
    # and the kubelets itself. No reboots, no draining, no per-node work.
    cmd: talosctl --nodes {{.IP}} upgrade-k8s --to {{.KUBERNETES_VERSION}}
    vars:
      KUBERNETES_VERSION:
        sh: yq eval -r '.kubernetesVersion' {{.TALOS_DIR}}/talenv.yaml
      IP:
        sh: '{{.RENDER}} nodes controlplane | head -1 | xargs {{.RENDER}} ip'
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: '{{.TALOS_DIR}}'
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: >-
      talosctl --nodes {{.NODES}} reset --reboot
      {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }}
      --graceful=false --wait=false
    vars:
      NODES:
        sh: '{{.RENDER}} nodes | xargs -I{} {{.RENDER}} ip {} | paste -sd,'
    preconditions:
      - which talosctl yq
